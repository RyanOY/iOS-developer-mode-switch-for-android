name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then SDK_ROOT="$HOME/android-sdk"; fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDK_ROOT"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "${SDKMGR:-}" ] || [ ! -x "$SDKMGR" ]; then
            echo "sdkmanager not found, downloading command line tools"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager at $SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          yes 2>/dev/null | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls -1 "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools" 2>/dev/null || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Build go-ios for Android arm64
        run: bash scripts/build-goios.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/iOS-Developer-Mode-${GITHUB_SHA::7}.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Developer-Mode-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
